<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Bholu 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #35105c, #12051f 75%);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Birthday heading */
.title {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    z-index: 20;
    font-size: clamp(32px, 8vw, 65px);
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow:
        0 0 10px #fff,
        0 0 20px #ff4fd8,
        0 0 40px #ff4fd8;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

/* Photo */
.photo-box {
    position: relative;
    z-index: 10;
    width: min(70vw, 300px);
    height: min(70vw, 300px);
    border-radius: 50%;
    padding: 8px;
    background: linear-gradient(45deg, #ffd700, #ff4fd8, #00eaff);
    box-shadow:
        0 0 20px #ff4fd8,
        0 0 50px rgba(255, 79, 216, .7);
    animation: photoGlow 2s infinite alternate;
}

.photo-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #160722;
}

@keyframes photoGlow {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

/* Balloons */
.balloon {
    position: absolute;
    bottom: -120px;
    width: 55px;
    height: 70px;
    border-radius: 50%;
    opacity: .9;
    animation: fly linear infinite;
    z-index: 3;
}

.balloon::after {
    content: "";
    position: absolute;
    width: 2px;
    height: 90px;
    background: white;
    left: 50%;
    top: 68px;
}

.balloon:nth-child(1) {
    left: 5%;
    background: #ff3b6b;
    animation-duration: 9s;
}

.balloon:nth-child(2) {
    left: 20%;
    background: #00d9ff;
    animation-duration: 12s;
    animation-delay: 2s;
}

.balloon:nth-child(3) {
    left: 78%;
    background: #ffd500;
    animation-duration: 10s;
    animation-delay: 1s;
}

.balloon:nth-child(4) {
    left: 90%;
    background: #9d4edd;
    animation-duration: 13s;
    animation-delay: 3s;
}

.balloon:nth-child(5) {
    left: 45%;
    background: #00ff9d;
    animation-duration: 11s;
    animation-delay: 4s;
}

@keyframes fly {
    0% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-60vh) rotate(8deg);
    }
    100% {
        transform: translateY(-120vh) rotate(-8deg);
    }
}

/* Confetti */
.confetti {
    position: absolute;
    width: 9px;
    height: 18px;
    top: -30px;
    animation: fall linear infinite;
    z-index: 15;
}

@keyframes fall {
    to {
        transform: translateY(110vh) rotate(720deg);
    }
}

/* Party poppers */
.popper {
    position: absolute;
    font-size: 70px;
    z-index: 18;
    animation: pop .8s ease-out forwards;
}

.popper.left {
    left: 5%;
    bottom: 15%;
}

.popper.right {
    right: 5%;
    bottom: 15%;
}

@keyframes pop {
    0% {
        transform: scale(0) rotate(-30deg);
    }
    70% {
        transform: scale(1.3) rotate(10deg);
    }
    100% {
        transform: scale(1) rotate(0);
    }
}

/* Crackers */
.firework {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    z-index: 5;
    animation: explode 1.2s infinite;
}

.firework.one {
    top: 18%;
    left: 15%;
}

.firework.two {
    top: 22%;
    right: 15%;
    animation-delay: .6s;
}

@keyframes explode {
    0% {
        box-shadow: 0 0 0 0 white;
        opacity: 1;
    }

    50% {
        box-shadow:
        0 -70px 0 2px #ffdd00,
        50px -50px 0 2px #ff4dff,
        70px 0 0 2px #00eaff,
        50px 50px 0 2px #ff4444,
        0 70px 0 2px #ffd000,
        -50px 50px 0 2px #00ff88,
        -70px 0 0 2px #ff66cc,
        -50px -50px 0 2px #ffffff;
    }

    100% {
        opacity: 0;
    }
}

/* Bottom message */
.message {
    position: absolute;
    bottom: 30px;
    z-index: 20;
    font-size: 18px;
    text-align: center;
    opacity: .9;
}

/* Mobile */
@media(max-width:600px) {
    .title {
        top: 45px;
        font-size: 35px;
    }

    .photo-box {
        width: 230px;
        height: 230px;
    }

    .popper {
        font-size: 50px;
    }
}
</style>
</head>

<body>

<h1 class="title">HAPPY BIRTHDAY BHOLU 🎂</h1>

<!-- YOUR FRIEND'S PHOTO -->
<div class="photo-box">
    <img src="IMG_20260430_221011.jpg" alt="Bholu">
</div>

<!-- Balloons -->
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

<!-- Fireworks -->
<div class="firework one"></div>
<div class="firework two"></div>

<!-- Party Poppers -->
<div class="popper left">🎉</div>
<div class="popper right">🎊</div>

<div class="message">
    ✨ Wishing you an amazing birthday! ✨
</div>

<script>

/* Create falling confetti */
const colors = [
    "#ff4d6d",
    "#ffd166",
    "#06d6a0",
    "#4cc9f0",
    "#f72585",
    "#ffffff"
];

for(let i = 0; i < 90; i++) {

    const confetti = document.createElement("div");

    confetti.className = "confetti";

    confetti.style.left = Math.random() * 100 + "vw";

    confetti.style.background =
        colors[Math.floor(Math.random() * colors.length)];

    confetti.style.animationDuration =
        (3 + Math.random() * 5) + "s";

    confetti.style.animationDelay =
        Math.random() * 5 + "s";

    confetti.style.transform =
        `rotate(${Math.random() * 360}deg)`;

    document.body.appendChild(confetti);
}

</script>

</body>
  </html>
