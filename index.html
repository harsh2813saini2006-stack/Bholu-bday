<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Bholu 🎂</title>

<style>

* {.love {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #ffb6e6;
    text-shadow: 0 0 12px #ff4fd8;
}

.wish {
    font-size: 17px;
}
  }

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at center, #42106b 0%, #19052b 55%, #08020e 100%);
    color: white;
}

/* =========================
   OPEN SCREEN
========================= */

#startScreen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background:
        radial-gradient(circle, #47116e, #10031b);
    text-align: center;
    transition: opacity 1s ease;
}

.startEmoji {
    font-size: 75px;
    animation: giftBounce 1.5s infinite;
}

.startText {
    margin-top: 20px;
    font-size: 28px;
    font-weight: bold;
    text-shadow: 0 0 20px #ff4fd8;
}

.openBtn {
    margin-top: 30px;
    padding: 16px 32px;
    border: none;
    border-radius: 40px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: linear-gradient(45deg, #ff2fa4, #8d3cff);
    box-shadow:
        0 0 15px #ff2fa4,
        0 0 35px #8d3cff;
    cursor: pointer;
    animation: buttonGlow 1.5s infinite alternate;
}

@keyframes giftBounce {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-15px);
    }
}

@keyframes buttonGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}

/* =========================
   MAIN BIRTHDAY PAGE
========================= */

#birthdayPage {
    display: none;
    min-height: 100vh;
    width: 100%;
    position: relative;
    justify-content: center;
    align-items: center;
}

/* =========================
   TITLE
========================= */

.title {
    position: absolute;
    top: 35px;
    width: 100%;
    text-align: center;
    z-index: 30;

    font-size: clamp(32px, 8vw, 62px);
    font-weight: 900;
    letter-spacing: 3px;

    color: white;

    text-shadow:
        0 0 8px white,
        0 0 20px #ff4fd8,
        0 0 40px #ff4fd8;

    animation: titleGlow 1.5s infinite alternate;
}

@keyframes titleGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

/* =========================
   PHOTO
========================= */

.photo-box {
    position: relative;
    z-index: 20;

    width: min(70vw, 310px);
    height: min(70vw, 310px);

    padding: 8px;

    border-radius: 50%;

    background:
        linear-gradient(
            45deg,
            #ffd700,
            #ff4fd8,
            #00eaff,
            #ffd700
        );

    background-size: 300% 300%;

    animation:
        borderMove 4s linear infinite,
        photoGlow 2s infinite alternate;

    box-shadow:
        0 0 20px #ff4fd8,
        0 0 50px rgba(255, 79, 216, .8);
}

.photo-box img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    border: 5px solid #160722;

    display: block;
}

@keyframes borderMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes photoGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

/* =========================
   BALLOONS
========================= */

.balloon {
    position: absolute;

    bottom: -120px;

    width: 55px;
    height: 70px;

    border-radius: 50%;

    opacity: .9;

    animation: balloonFly linear infinite;

    z-index: 5;
}

.balloon::after {
    content: "";

    position: absolute;

    width: 2px;
    height: 100px;

    background: rgba(255,255,255,.7);

    left: 50%;
    top: 68px;
}

.balloon::before {
    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    background: inherit;

    bottom: -3px;
    left: 23px;

    transform: rotate(45deg);
}

.balloon:nth-child(1) {
    left: 3%;
    background: #ff3b6b;
    animation-duration: 9s;
}

.balloon:nth-child(2) {
    left: 18%;
    background: #00d9ff;
    animation-duration: 12s;
    animation-delay: 2s;
}

.balloon:nth-child(3) {
    left: 78%;
    background: #ffd500;
    animation-duration: 10s;
    animation-delay: 1s;
}

.balloon:nth-child(4) {
    left: 90%;
    background: #9d4edd;
    animation-duration: 13s;
    animation-delay: 3s;
}

.balloon:nth-child(5) {
    left: 45%;
    background: #00ff9d;
    animation-duration: 11s;
    animation-delay: 4s;
}

.balloon:nth-child(6) {
    left: 60%;
    background: #ff7b00;
    animation-duration: 14s;
    animation-delay: 5s;
}

@keyframes balloonFly {

    0% {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {
        transform:
            translateY(-60vh)
            rotate(8deg);
    }

    100% {
        transform:
            translateY(-120vh)
            rotate(-8deg);
    }
}

/* =========================
   CONFETTI
========================= */

.confetti {
    position: absolute;

    width: 8px;
    height: 17px;

    top: -30px;

    z-index: 25;

    animation:
        confettiFall linear infinite;
}

@keyframes confettiFall {

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

/* =========================
   FIREWORKS
========================= */

.firework {
    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    z-index: 8;

    animation: fireworkExplosion 1.4s infinite;
}

.firework.one {
    top: 20%;
    left: 15%;
}

.firework.two {
    top: 25%;
    right: 15%;

    animation-delay: .7s;
}

.firework.three {
    top: 45%;
    left: 8%;

    animation-delay: 1.2s;
}

@keyframes fireworkExplosion {

    0% {
        box-shadow: 0 0 0 0 white;
        opacity: 1;
    }

    50% {
        box-shadow:

        0 -70px 0 2px #ffdd00,

        50px -50px 0 2px #ff4dff,

        70px 0 0 2px #00eaff,

        50px 50px 0 2px #ff4444,

        0 70px 0 2px #ffd000,

        -50px 50px 0 2px #00ff88,

        -70px 0 0 2px #ff66cc,

        -50px -50px 0 2px white;

        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* =========================
   PARTY POPPERS
========================= */

.popper {
    position: absolute;

    font-size: 65px;

    z-index: 28;

    animation: popperAnimation .8s ease-out forwards;
}

.popper.left {
    left: 4%;
    bottom: 13%;
}

.popper.right {
    right: 4%;
    bottom: 13%;
}

@keyframes popperAnimation {

    0% {
        transform:
            scale(0)
            rotate(-30deg);
    }

    70% {
        transform:
            scale(1.3)
            rotate(10deg);
    }

    100% {
        transform:
            scale(1)
            rotate(0);
    }
}

/* =========================
   MUSIC BUTTON
========================= */

.musicBtn {
    position: absolute;

    bottom: 35px;

    z-index: 40;

    padding: 11px 22px;

    border: none;
    border-radius: 30px;

    background: rgba(255,255,255,.15);

    border: 1px solid rgba(255,255,255,.4);

    color: white;

    font-size: 15px;

    backdrop-filter: blur(8px);
}

/* =========================
   BOTTOM MESSAGE
========================= */

.message {
    position: absolute;

    bottom: 78px;

    width: 100%;

    text-align: center;

    z-index: 30;

    font-size: 17px;

    text-shadow: 0 0 10px white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .title {
        top: 45px;
        font-size: 34px;
        padding: 0 10px;
    }

    .photo-box {
        width: 230px;
        height: 230px;
    }

    .popper {
        font-size: 48px;
    }

    .message {
        font-size: 15px;
    }
}

</style>
</head>


<body>


<!-- =========================
     OPEN SCREEN
========================= -->

<div id="startScreen">

    <div class="startEmoji">
        🎁
    </div>

    <div class="startText">
        Someone has a birthday surprise...
    </div>

    <button class="openBtn" onclick="openSurprise()">
        OPEN YOUR SURPRISE 🎉
    </button>

</div>


<!-- =========================
     BIRTHDAY PAGE
========================= -->

<div id="birthdayPage">


    <h1 class="title">
        HAPPY BIRTHDAY BHOLU 🎂
    </h1>


    <!-- YOUR PHOTO -->

    <div class="photo-box">

        <img
            src="IMG_20260430_221011.jpg"
            alt="Bholu"
        >

    </div>


    <!-- BALLOONS -->

    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>
    <div class="balloon"></div>


    <!-- FIREWORKS -->

    <div class="firework one"></div>
    <div class="firework two"></div>
    <div class="firework three"></div>


    <!-- PARTY POPPERS -->

    <div class="popper left">
        🎉
    </div>

    <div class="popper right">
        🎊
    </div>


    <!-- MESSAGE -->
    <div class="message">
    <div class="love">💕 Luv U Baby 💕</div>
    <div class="wish">✨ Wishing you an amazing birthday! ✨</div>
    </div>
    


    <!-- MUSIC -->

    <audio id="birthdaySong" loop>

        <source
            src="International%20Holiday.mp3"
            type="audio/mpeg"
        >

    </audio>


    <button
        class="musicBtn"
        onclick="toggleMusic()"
        id="musicButton"
    >
        🔊 Music ON
    </button>


</div>


<script>

/* =========================
   OPEN SURPRISE
========================= */

function openSurprise() {

    const startScreen =
        document.getElementById("startScreen");

    const birthdayPage =
        document.getElementById("birthdayPage");

    const song =
        document.getElementById("birthdaySong");


    /* Show birthday page */

    birthdayPage.style.display = "flex";


    /* Fade out opening screen */

    startScreen.style.opacity = "0";


    setTimeout(function() {

        startScreen.style.display = "none";

    }, 1000);


    /* Start music */

    song.play().catch(function(error) {

        console.log(
            "Music could not start automatically:",
            error
        );

    });


    /* Create confetti */

    createConfetti();

}


/* =========================
   MUSIC TOGGLE
========================= */

function toggleMusic() {

    const song =
        document.getElementById("birthdaySong");

    const button =
        document.getElementById("musicButton");


    if (song.paused) {

        song.play();

        button.innerHTML =
            "🔊 Music ON";

    } else {

        song.pause();

        button.innerHTML =
            "🔇 Music OFF";

    }

}


/* =========================
   CONFETTI
========================= */

function createConfetti() {

    const colors = [

        "#ff4d6d",
        "#ffd166",
        "#06d6a0",
        "#4cc9f0",
        "#f72585",
        "#ffffff",
        "#9d4edd"

    ];


    for (let i = 0; i < 120; i++) {

        const confetti =
            document.createElement("div");


        confetti.className =
            "confetti";


        confetti.style.left =
            Math.random() * 100 + "vw";


        confetti.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];


        confetti.style.animationDuration =
            (3 + Math.random() * 5) + "s";


        confetti.style.animationDelay =
            Math.random() * 4 + "s";


        confetti.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        document
            .getElementById("birthdayPage")
            .appendChild(confetti);

    }

}

</script>

</body>
</html>
